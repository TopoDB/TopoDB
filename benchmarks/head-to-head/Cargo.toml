[package]
name = "head-to-head"
version = "0.0.0"
edition = "2021"
publish = false

# Standalone crate, deliberately not a workspace member. This empty
# [workspace] table stops cargo's ancestor-directory workspace discovery,
# which otherwise walks past this worktree's own (excluding) Cargo.toml and
# picks up the main checkout's workspace root instead (this worktree is
# nested inside /Users/drew/TopoDB).
[workspace]

[dependencies]
topodb = { path = "../../crates/topodb" }
minigraf = "1.2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
sysinfo = "0.30"
thiserror = "1"

[dev-dependencies]
criterion = "0.5"
tempfile = "3"

[[bench]]
name = "head_to_head"
harness = false
