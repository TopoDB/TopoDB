name: npm-deprecate
# Registry hygiene without local credentials: NPM_TOKEN lives only in Actions
# secrets (write-only), so deprecation messages are applied from here.
# Dispatch-gated to repo maintainers by GitHub's own permission model.
on:
  workflow_dispatch:
    inputs:
      package_spec:
        description: 'package@version to deprecate (e.g. topodb@0.1.0)'
        required: true
      message:
        description: 'deprecation message (empty string un-deprecates)'
        required: true

jobs:
  deprecate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - name: Deprecate
        run: npm deprecate "${{ inputs.package_spec }}" "${{ inputs.message }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Verify
        run: npm view "${{ inputs.package_spec }}" deprecated
