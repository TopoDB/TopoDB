name: bindings
on:
  push:
    branches: [main]
    tags: ['bindings-v*']
    paths: ['crates/topodb-py/**', 'crates/topodb-node/**', 'crates/topodb/**',
            'crates/topodb-json/**', 'fixtures/**', '.github/workflows/bindings.yml']
  pull_request:
    paths: ['crates/topodb-py/**', 'crates/topodb-node/**', 'crates/topodb/**',
            'crates/topodb-json/**', 'fixtures/**', '.github/workflows/bindings.yml']

jobs:
  test-python:
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-latest, macos-latest, windows-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pytest
      - run: pip install ./crates/topodb-py
      - run: pytest crates/topodb-py/tests -v

  test-node:
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-latest, macos-latest, windows-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
        working-directory: crates/topodb-node
      - run: npx napi build --platform --js native.js --dts native.d.ts
        working-directory: crates/topodb-node
      - run: node --test
        working-directory: crates/topodb-node

  parity-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: python3 scripts/parity_cli.py

  # PR-time dry-run coverage for the npm publish path: the platform dirs and
  # the main package must at least pack cleanly on every run, not just on tags.
  npm-pack-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Pack platform packages (dry run)
        run: |
          for d in crates/topodb-node/npm/*/; do
            (cd "$d" && npm pack --dry-run)
          done
      - name: Pack main package (dry run)
        run: npm pack --dry-run
        working-directory: crates/topodb-node

  # Built on every run (not just tags) so sdist breakage surfaces on PRs.
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/topodb-py
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with: { name: sdist, path: crates/topodb-py/dist }

  wheels:
    if: startsWith(github.ref, 'refs/tags/bindings-v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64 }
          - { os: ubuntu-latest, target: aarch64 }
          - { os: macos-latest, target: universal2-apple-darwin }
          - { os: windows-latest, target: x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/topodb-py
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with: { name: 'wheels-${{ matrix.os }}-${{ matrix.target }}', path: crates/topodb-py/dist }

  napi-prebuilds:
    if: startsWith(github.ref, 'refs/tags/bindings-v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, platform: linux-x64-gnu }
          # Native arm64 runner (free for public repos) — the zig cross-link
          # failed on rustc's aarch64 erratum flag (--fix-cortex-a53-843419,
          # rejected by zig's lld wrapper on the bindings-v0.1.0 run).
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, platform: linux-arm64-gnu }
          - { os: macos-latest, target: x86_64-apple-darwin, platform: darwin-x64 }
          - { os: macos-latest, target: aarch64-apple-darwin, platform: darwin-arm64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, platform: win32-x64-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: '${{ matrix.target }}' }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
        working-directory: crates/topodb-node
      - run: npx napi build --platform --release --target ${{ matrix.target }} --js native.js --dts native.d.ts
        working-directory: crates/topodb-node
      - uses: actions/upload-artifact@v4
        with: { name: 'napi-${{ matrix.platform }}', path: 'crates/topodb-node/*.node' }

  # Reachable only on a bindings-v* tag with every needed job green: a custom
  # job-level `if` without a status function still gets success() applied, so a
  # red or skipped dependency skips the publish.
  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/bindings-v')
    needs: [test-python, test-node, parity-cli, wheels, sdist]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: 'wheels-*'
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      # Trusted publishing (OIDC pending publisher on pypi.org) — no API token.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  publish-npm-bindings:
    if: startsWith(github.ref, 'refs/tags/bindings-v')
    needs: [test-python, test-node, parity-cli, napi-prebuilds]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/download-artifact@v4
        with:
          pattern: 'napi-*'
          merge-multiple: true
          path: prebuilds
      - name: Place .node binaries into platform dirs
        run: |
          for d in crates/topodb-node/npm/*/; do
            platform=$(basename "$d")
            cp "prebuilds/topodb.${platform}.node" "$d"
          done
      # Platform packages go first so a partial failure leaves the unscoped
      # `topodb` name unpublished rather than published-but-broken.
      - name: Publish platform packages
        run: |
          for d in crates/topodb-node/npm/*/; do
            (cd "$d" && npm publish --access public)
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish main package
        run: npm publish --access public
        working-directory: crates/topodb-node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
