[package]
name = "topodb-sgh"
version = "0.0.8"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Structured Graph Harness — frozen-DAG agent execution over TopoDB"
repository = "https://github.com/TopoDB/TopoDB"

[features]
default = ["claude-code", "anthropic", "openai", "cli"]
claude-code = []
http = ["dep:ureq"]
anthropic = ["http"]
openai = ["http"]
cli = ["dep:clap", "dep:ctrlc"]

[dependencies]
topodb = { path = "../topodb", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
jsonschema = "0.18"
thiserror = "1"
ulid = "1"
ureq = { version = "3.3", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
ctrlc = { version = "3", optional = true }

[[bin]]
name = "sgh"
path = "src/bin/sgh.rs"
required-features = ["cli"]

[[test]]
name = "bridge_lifecycle"
harness = false
required-features = ["http"]

[dev-dependencies]
proptest = "1"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
