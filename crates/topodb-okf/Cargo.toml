[package]
name = "topodb-okf"
version = "0.0.1"
edition = "2021"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
description = "Open Knowledge Format (OKF) bundle ingest/seed layer for the TopoDB agent-memory engine"
repository = "https://github.com/TopoDB/TopoDB"
readme = "README.md"
keywords = ["okf", "markdown", "memory", "graph", "agent"]
categories = ["database"]

# Library crate, no binary — never shipped by cargo-dist.
[package.metadata.dist]
dist = false

[dependencies]
topodb = { path = "../topodb", version = "0.0.17" }
topodb-json = { path = "../topodb-json", version = "0.0.14" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# serde_yaml is unmaintained upstream but is the workspace's existing YAML
# dep (topodb-sgh); a future swap should move both crates at once.
serde_yaml = "0.9"

[dev-dependencies]
tempfile = "3"
# Seed selection reuses obsidian's `select_by_query`/`select_by_entity`
# unchanged (design §Seed), so tests build the working set through them.
topodb-obsidian = { path = "../topodb-obsidian", version = "0.0.6" }
