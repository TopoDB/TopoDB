[package]
name = "topodb-py"
version = "0.1.0"
edition = "2021"
publish = false
description = "Python (pyo3) binding for TopoDB"
license = "MIT OR Apache-2.0"
repository = "https://github.com/TopoDB/TopoDB"

[lib]
name = "topodb_py"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["abi3-py39", "extension-module"] }
pythonize = "0.23"
serde_json = "1"
crossbeam-channel = "0.5"
topodb = { path = "../topodb" }
topodb-json = { path = "../topodb-json" }
