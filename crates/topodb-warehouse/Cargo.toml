[package]
name = "topodb-warehouse"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
description = "Context warehouse: append-only raw-context log + deterministic derive layer for the TopoDB agent-memory engine"
repository = "https://github.com/TopoDB/TopoDB"
readme = "README.md"
keywords = ["memory", "graph", "agent", "warehouse", "provenance"]
categories = ["database"]

[package.metadata.dist]
dist = false

[dependencies]
topodb = { path = "../topodb", version = "0.1.0" }
topodb-json = { path = "../topodb-json", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
lz4_flex = "0.11"
ulid = "1"
regex = "1"

[dev-dependencies]
tempfile = "3"
