[package]
name = "topodb-cli"
version = "0.0.15"
edition = "2021"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
description = "Command-line interface for the TopoDB agent-memory engine"
repository = "https://github.com/TopoDB/TopoDB"
readme = "README.md"
keywords = ["cli", "graph", "database", "agent", "memory"]
categories = ["command-line-utilities", "database"]

[[bin]]
name = "topodb"
path = "src/main.rs"

[dependencies]
topodb = { path = "../topodb", version = "0.0.18" }
topodb-json = { path = "../topodb-json", version = "0.0.15" }
topodb-obsidian = { path = "../topodb-obsidian", version = "0.0.7" }
topodb-onboarding = { path = "../topodb-onboarding" }
topodb-warehouse = { path = "../topodb-warehouse", version = "0.0.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
toml = "0.8"
sha2 = "0.11.0"

[dev-dependencies]
tempfile = "3"
topodb-onboarding = { path = "../topodb-onboarding" }
