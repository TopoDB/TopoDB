[package]
name = "topodb-obsidian"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
description = "Obsidian-format vault ingest/seed layer for the TopoDB agent-memory engine"
repository = "https://github.com/TopoDB/TopoDB"
readme = "README.md"
keywords = ["obsidian", "markdown", "memory", "graph", "agent"]
categories = ["database"]

# Library crate, no binary — never shipped by cargo-dist.
[package.metadata.dist]
dist = false

[dependencies]
topodb = { path = "../topodb", version = "0.1.0" }
topodb-json = { path = "../topodb-json", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# serde_yaml is unmaintained upstream but is the workspace's existing YAML
# dep (topodb-sgh); a future swap should move both crates at once.
serde_yaml = "0.9"

[dev-dependencies]
tempfile = "3"
